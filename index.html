<!DOCTYPE html>
<html lang="en">
<head>

    <style>

        body {
            background-color: rgb(233, 251, 233);
            font-family:Georgia, 'Times New Roman', Times, serif;
            color: rgb(2, 86, 2);
            align-items: center;
        }

        h3 {
            font-family:Georgia, 'Times New Roman', Times, serif;
            text-align: center;
            color: rgb(255, 139, 159);
            font-size: 1.5em;
        }

        .photo {
            text-align: center;
        }

        img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            box-shadow: 0px 4px 14px rgb(222, 18, 52);
        }

        img:hover {
            transform: rotate(10deg);
        }

        img:active {
            transform: scale(0.8);
        }

        .video {
            text-align: center;
        }

        .video iframe {
            position: relative;
            size: 100%;
            background-color: rgb(243, 187, 203);
            padding: 10px;
            margin-bottom: 50px;
        }

        .video iframe:hover {
            background-color: rgb(184, 115, 126);
        }

        .biography {
            width: fit-content;
            background-color: rgb(157, 235, 157);
            padding: 5px;
            text-align: center;
        }

        p {
            font-style: italic;
            font-size: 16px;
        }

    </style>

</head>
<body>

    <section class="photo">
        <h3>Cute photo of a cat in swag hoodie</h3>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScWpvWOfUOOuflDycBItZ0fzwA_zx44fbxDBIDKGbIPSTsUMyLqRAXD3Y&s=10" alt="Cat in frog hoodie">
    </section>

    <section class="video">
        <h3>Favorite travel destination!!!</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/FY3KdoXNd2U?si=FnfxX9OfNmmt6hRa" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>

    <section class="biography">
        <div>
            <p>Hello! I love cats and music. The color code of this website is strawberry matcha.</p>
        </div>
    </section>

</body>
</html>
